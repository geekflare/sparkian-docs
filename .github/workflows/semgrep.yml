name: Semgrep SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so new Semgrep rules get applied even without code changes.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `--config auto` picks free, community rulesets based on the languages
      # detected in the repo (JS/TS/React here) - no Semgrep account needed.
      # Non-blocking for now: this introduces scanning without turning
      # existing PRs red on day one. Drop `continue-on-error` once the repo
      # is triaged if you want findings to fail the build.
      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true

      # Always keep a downloadable copy of the results as compliance
      # evidence, independent of whether the Security tab upload below
      # succeeds (private repos on GitHub Free may not support it).
      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 90

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
