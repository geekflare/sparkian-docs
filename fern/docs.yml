# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: sparkian.docs.buildwithfern.com
    custom-domain: docs.sparkian.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: sparkian-docs
        branch: main
      launch: dashboard
title: Sparkian Docs
layout:
  searchbar-placement: header
  page-width: padded
  tabs-placement: header
tabs:
  home:
    display-name: Home
    icon: home
navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-solid fa-house
          - page: Guest mode
            path: docs/pages/guest-mode.mdx
            icon: fa-solid fa-user-clock
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-solid fa-headset
      - section: Workspaces
        contents:
          - page: Workspaces
            path: docs/pages/workspaces/overview.mdx
            icon: fa-solid fa-building
      - section: Projects
        contents:
          - page: Projects
            path: docs/pages/projects/overview.mdx
            icon: fa-solid fa-cube
      - section: Billing
        contents:
          - page: Plans
            path: docs/pages/billing/plans.mdx
            icon: fa-solid fa-layer-group
          - page: Payment methods
            path: docs/pages/billing/payment-methods.mdx
            icon: fa-solid fa-credit-card
          - page: Sparks (credit system)
            path: docs/pages/billing/sparks.mdx
            icon: fa-solid fa-bolt
      - section: Library
        contents:
          - page: Library
            path: docs/pages/library/overview.mdx
            icon: fa-solid fa-book-open
          - page: Knowledge base
            path: docs/pages/library/knowledge-base.mdx
            icon: fa-solid fa-database
          - page: Canvas and artifacts
            path: docs/pages/library/canvas.mdx
            icon: fa-solid fa-swatchbook
      - section: Chat
        contents:
          - page: Creating images
            path: docs/pages/chat/create-image.mdx
            icon: fa-solid fa-image
          - page: Multi-model chat
            path: docs/pages/chat/multi-model-chat.mdx
            icon: fa-solid fa-table-columns
          - page: Chat branching
            path: docs/pages/chat/chat-branching.mdx
            icon: fa-solid fa-code-branch
          - page: Chat response actions
            path: docs/pages/chat/chat-response-actions.mdx
            icon: fa-solid fa-message
          - page: Editing a message
            path: docs/pages/chat/edit-a-message.mdx
            icon: fa-solid fa-pen
          - page: Sharing a chat
            path: docs/pages/chat/share-a-chat.mdx
            icon: fa-solid fa-share-nodes
          - page: Searching chats
            path: docs/pages/chat/search-chats.mdx
            icon: fa-solid fa-magnifying-glass
          - page: Deleting messages and chats
            path: docs/pages/chat/delete-messages-and-chats.mdx
            icon: fa-solid fa-trash
          - page: Web search and URL read
            path: docs/pages/chat/web-search-and-url-read.mdx
            icon: fa-solid fa-globe
          - page: HTML and SVG preview
            path: docs/pages/chat/html-and-svg-preview.mdx
            icon: fa-solid fa-code
          - page: Mermaid diagrams
            path: docs/pages/chat/mermaid-diagrams.mdx
            icon: fa-solid fa-sitemap
          - page: Voice input
            path: docs/pages/chat/voice-input.mdx
            icon: fa-solid fa-microphone
          - page: Prompt enhancer
            path: docs/pages/chat/prompt-enhancer.mdx
            icon: fa-solid fa-wand-magic-sparkles
          - page: Supported file types
            path: docs/pages/chat/supported-file-types.mdx
            icon: fa-solid fa-paperclip
          - page: Memory and context
            path: docs/pages/chat/memory-and-context.mdx
            icon: fa-solid fa-brain
          - page: Copy and export
            path: docs/pages/chat/copy-export.mdx
            icon: fa-solid fa-copy
          - page: Long context notice
            path: docs/pages/chat/long-context-notice.mdx
            icon: fa-solid fa-triangle-exclamation
      - section: Account
        contents:
          - page: Appearance
            path: docs/pages/account/appearance.mdx
            icon: fa-solid fa-moon
      - section: Changelog
        contents:
          - changelog: docs/changelog
navbar-links:
  - type: filled
    text: Login
    href: https://sparkian.com
colors:
  accent-primary:
    light: "#FF5A1F"
    dark: "#FF5A1F"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: logo-dark.svg
  light: logo-transparent.svg
  height: 25
  href: https://docs.sparkian.com/
favicon: favicon.png
metadata:
  og:site_name: Sparkian
  og:title: Sparkian Docs
  og:url: https://sparkian.com
  og:image: https://cdn.sparkian.com/sparkian-sm.jpg
  twitter:card: summary_large_image
  twitter:site: "@SparkianAI"
  twitter:handle: "@SparkianAI"
  twitter:image: https://cdn.sparkian.com/sparkian-sm.jpg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
