# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: sparkian.docs.buildwithfern.com
    custom-domain: docs.sparkian.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: sparkian-docs
        branch: main
      launch: dashboard
title: Sparkian Docs
layout:
  searchbar-placement: header
  page-width: padded
  tabs-placement: header
tabs:
  home:
    display-name: Home
    icon: home
navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-solid fa-house
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-solid fa-headset
      - section: Billing
        contents:
          - page: Payment methods
            path: docs/pages/billing/payment-methods.mdx
            icon: fa-solid fa-credit-card
          - page: Sparks (credit system)
            path: docs/pages/billing/sparks.mdx
            icon: fa-solid fa-bolt
      - section: Chat
        contents:
          - page: Supported file types
            path: docs/pages/chat/supported-file-types.mdx
            icon: fa-solid fa-paperclip
          - page: Memory and context
            path: docs/pages/chat/memory-and-context.mdx
            icon: fa-solid fa-brain
          - page: Copy and export
            path: docs/pages/chat/copy-export.mdx
            icon: fa-solid fa-copy
          - page: Long context notice
            path: docs/pages/chat/long-context-notice.mdx
            icon: fa-solid fa-triangle-exclamation
      - section: Changelog
        contents:
          - changelog: docs/changelog
navbar-links:
  - type: filled
    text: Login
    href: https://sparkian.com
colors:
  accent-primary:
    light: "#FF5A1F"
    dark: "#FF5A1F"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 25
  href: https://docs.sparkian.com/
favicon: favicon.png
metadata:
  og:site_name: Sparkian
  og:title: Sparkian Docs
  og:url: https://sparkian.com
  og:image: https://cdn.sparkian.com/sparkian-sm.jpg
  twitter:card: summary_large_image
  twitter:site: "@SparkianAI"
  twitter:handle: "@SparkianAI"
  twitter:image: https://cdn.sparkian.com/sparkian-sm.jpg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
